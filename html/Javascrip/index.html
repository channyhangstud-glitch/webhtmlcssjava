<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name, id;
        let  student1, student2,  student3,  student4,  student5,  student6;
        let total, averacge;
         name =  prompt("Input name:");
          id = prompt("Input id:");
        student1 = Number (prompt("Input student1 Score:"));
        student2 = Number (prompt("Input student2 Score:"));
        student3 = Number (prompt("Input student3 Score:"));
        student4 = Number (prompt("Input student4 Score:"));
        student5 = Number (prompt("Input student5 Score:"));
        student6 = Number (prompt("Input student6 Score:"));
        total=  student1 + student2 +  student3 +  student4 +  student5 + student6;
        averacge = total/6;

        document.write("Name = " + name + "<br>");
        document.write("ID = " + id + "<br>");

        document.write("Student1=" +student1 +"<br>");
        document.write("Student2=" +student2 +"<br>");
        document.write("Student3=" +student3 +"<br>");
        document.write("Student4=" +student4 +"<br>");
        document.write("Student5=" +student5 +"<br>");
        document.write("Student6=" +student6 +"<br>");

        document.write("Total=" +total +"<br>");
        document.write("Averacge=" +averacge +"<br>");
    </script>
</body>
</html>
