<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
</head>
<body>
    <script>
        let code;
        let name;
        let qty, dis, price;
        let total_price, payment;

        code = prompt("Input code of product:");
        name = prompt("Input name:");
        qty = parseInt(prompt("Input qty:"));
        price = parseFloat(prompt("Input price:"));
        dis = parseFloat(prompt("Input discount (%):"));

        total_price = qty * price;
        payment = total_price - (total_price * dis) / 100;

        document.write("I have discount for you " + dis + "%<br>");
        document.write("Code of product = " + code + "<br>");
        document.write("Name of product = " + name + "<br>");
        document.write("Qty = " + qty + "<br>");
        document.write("Discount = " + dis + "%<br>");
        document.write("Price = $" + price + "<br>");
        document.write("Total Price = $" + total_price + "<br>");
        document.write("Payment = $" + payment + "<br>");
    </script>
</body>
</html>
